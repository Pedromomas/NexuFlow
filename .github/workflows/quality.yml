name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Interface and engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e "./engine[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Interface, package and safety regression
        shell: pwsh
        run: |
          npm run test:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest engine/tests app/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/anti-cheat-audit.ps1
      - name: Upload web test build
        uses: actions/upload-artifact@v4
        with:
          name: web-test-build
          path: dist/nexuflow/browser
          retention-days: 7
